name: İşlev önerisi
description: Bir kullanım ihtiyacını veya teknik ister eksiğini açıklayın.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: Kullanım ihtiyacı
      description: Yapmak istediğiniz işlemi ve mevcut engeli açıklayın.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Beklenen davranış
      description: İlgili teknik ister veya kabul maddesi varsa belirtin.
    validations:
      required: true
